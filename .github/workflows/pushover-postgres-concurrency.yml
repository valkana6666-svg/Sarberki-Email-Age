name: Isolated Pushover PostgreSQL concurrency
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: ['tests/pushover-postgres-concurrency.py', '.github/workflows/pushover-postgres-concurrency.yml']
permissions:
  contents: read
jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: ledger_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated multi-connection ledger verification
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: synthetic-local-only
          PGDATABASE: ledger_test
        run: python3 tests/pushover-postgres-concurrency.py
