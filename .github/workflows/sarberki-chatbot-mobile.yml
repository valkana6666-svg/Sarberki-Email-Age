name: Sarberki offline chatbot mobile proof
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths:
      - scripts/chatbot-mobile-proof.mjs
      - scripts/build-static.cjs
      - sarberki-chatbot-project/**
      - .github/workflows/sarberki-chatbot-mobile.yml
  workflow_dispatch:
    inputs:
      confirm_synthetic_only:
        description: 'Run isolated static mobile proof; no external services'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mobile:
    if: github.ref == 'refs/heads/gmail-test-subject-allowlist' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_synthetic_only == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[sarberki-browser-approval-20261011]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build the actual deployable static assets
        env:
          COMMIT_REF: ${{ github.sha }}
        run: node scripts/build-static.cjs
      - name: Only synthetic loopback mobile page checks
        env:
          CHATBOT_PROOF_ROOT: dist
        run: node scripts/chatbot-mobile-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarberki-chatbot-mobile-proof
          path: /tmp/sarberki-chatbot-proof/MOBILE-PROOF.json
          if-no-files-found: error
          retention-days: 7
