name: ElevenLabs TEST agent conversations (Claude, read-only)
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [docs/ELEVENLABS-READ-REQUEST.md]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read conversations
        env:
          XI_KEY: ${{ secrets.ELEVENLABS_CLAUDE_TEST_API_KEY }}
        run: |
          REQ="$(grep -v '^\s*$' docs/ELEVENLABS-READ-REQUEST.md | tail -n 1)"
          node scripts/elevenlabs-read.mjs "$REQ"
