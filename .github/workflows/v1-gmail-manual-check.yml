name: V1 Gmail manual test check
# One-shot test-branch push verification after multilingual regression was added.
on:
  workflow_dispatch:
  push:
    branches:
      - gmail-test-subject-allowlist
    paths:
      - .github/workflows/v1-gmail-manual-check.yml
      - operator-login-ui.mjs
      - tests/operator-login-ui.test.mjs
permissions:
  contents: read
jobs:
  gmail-tests:
    if: github.ref == 'refs/heads/gmail-test-subject-allowlist'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test branch
        run: test "$GITHUB_REF" = 'refs/heads/gmail-test-subject-allowlist'
      - name: Run isolated Gmail tests (no secrets or live services)
        run: npm run test:gmail
