name: Previo TEST – one past stay for the returning-guest test (Claude, owner permission per request)
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [docs/PREVIO-TEST-PAST-GUEST-REQUEST.md]
permissions:
  contents: read
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create, set checked out, read back
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
          PAST_GUEST_PHONE: ${{ secrets.PREVIO_TEST_PAST_GUEST_PHONE }}
        run: |
          test "$GITHUB_REF" = "refs/heads/gmail-test-subject-allowlist"
          node scripts/previo-test-past-guest.mjs
