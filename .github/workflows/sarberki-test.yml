name: Sarberki test branch checks

on:
  push:
    branches:
      - gmail-test-subject-allowlist
    paths-ignore:
      - scripts/backup-v2*.py
      - scripts/test_backup_v2*.py
      - .github/workflows/sarberki-backup-v2.yml
      - docs/BACKUP-V2*.md
  workflow_dispatch:
    inputs:
      verify_deployed:
        description: 'Verify an already released test deployment (does not deploy)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[sarberki-approval-once-20261011]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
  deployed-test-verification:
    name: Verify explicitly released test site
    if: github.ref == 'refs/heads/gmail-test-subject-allowlist' && github.event_name == 'workflow_dispatch' && inputs.verify_deployed == true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact test Netlify commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          TEST_NETLIFY_URL: https://leafy-chimera-2403e5.netlify.app
        run: node tests/deployment-sync.mjs
      - name: Check test-host operator session and case-store gates without credentials
        run: node scripts/operator-cloud-preflight.mjs
      - name: Verify operator PWA assets on the exact test deploy without credentials
        run: node tests/deployed-operator-pwa-smoke.mjs
      - name: Verify deployed MNB helper without any Previo calls
        run: node tests/deployed-manual-fx-smoke.mjs
      - name: Verify deployed public price reference without any Previo calls
        run: node tests/deployed-price-reference-smoke.mjs
      - name: Live Previo price smoke test on exact test deploy
        # Push validation stays offline; live smoke needs an explicit manual dispatch.
        if: ${{ github.event_name == 'workflow_dispatch' && vars.SARBERKI_PREVIO_LIVE_SMOKE_ENABLED == 'true' }}
        run: node tests/live-price-smoke.mjs

  backup-copy-offline:
    if: ${{ !contains(github.event.head_commit.message, '[sarberki-approval-once-20261011]') }}
    name: Offline Windows encrypted-backup copy checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic backup copy safety regression
        shell: pwsh
        run: ./scripts/test-copy-owner-encrypted-backup.ps1
