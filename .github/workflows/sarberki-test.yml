name: Sarberki test branch checks

on:
  push:
    branches:
      - gmail-test-subject-allowlist
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Verify exact test Netlify commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          TEST_NETLIFY_URL: https://leafy-chimera-2403e5.netlify.app
        run: node tests/deployment-sync.mjs
      - name: Live Previo price smoke test on exact test deploy
        if: ${{ vars.SARBERKI_PREVIO_LIVE_SMOKE_ENABLED == 'true' }}
        run: node tests/live-price-smoke.mjs
