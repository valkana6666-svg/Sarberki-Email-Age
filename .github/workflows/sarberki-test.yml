name: Sarberki test branch checks

on:
  push:
    branches:
      - gmail-test-subject-allowlist
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Verify exact test Netlify commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          TEST_NETLIFY_URL: https://leafy-chimera-2403e5.netlify.app
        run: node tests/deployment-sync.mjs
      - name: Verify deployed MNB helper without any Previo calls
        run: node tests/deployed-manual-fx-smoke.mjs
      - name: Verify deployed public price reference without any Previo calls
        run: node tests/deployed-price-reference-smoke.mjs
      - name: Live Previo price smoke test on exact test deploy
        # Push validation stays offline; live smoke needs an explicit manual dispatch.
        if: ${{ github.event_name == 'workflow_dispatch' && vars.SARBERKI_PREVIO_LIVE_SMOKE_ENABLED == 'true' }}
        run: node tests/live-price-smoke.mjs

  backup-copy-offline:
    name: Offline Windows encrypted-backup copy checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic backup copy safety regression
        shell: pwsh
        run: ./scripts/test-copy-owner-encrypted-backup.ps1
