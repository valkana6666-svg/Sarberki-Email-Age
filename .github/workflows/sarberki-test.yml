name: Sarberki test branch checks

on:
  push:
    branches:
      - gmail-test-subject-allowlist
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Live Previo price smoke test on test Netlify
        run: node tests/live-price-smoke.mjs
