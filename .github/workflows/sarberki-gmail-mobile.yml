name: Sarberki synthetic Gmail operator mobile proof
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths:
      - index.html
      - sarberki-chatbot-project/operator-session.mjs
      - sarberki-chatbot-project/remote-chat-client.mjs
      - synthetic-server-preview.mjs
      - scripts/gmail-server-mobile-proof.mjs
      - scripts/operator-write-approval-mobile-proof.mjs
      - cloud-approval.html
      - cloud-approval.css
      - cloud-approval-session.mjs
      - isolated-approval-panel.mjs
      - operator-login-ui.mjs
      - shared-core/case-store-client.mjs
      - .github/workflows/sarberki-gmail-mobile.yml
permissions:
  contents: read
jobs:
  mobile:
    if: github.ref == 'refs/heads/gmail-test-subject-allowlist'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Loopback synthetic UI only; external requests blocked
        run: node scripts/gmail-server-mobile-proof.mjs
      - name: Synthetic Writer and separate approval mobile UI; all requests intercepted
        run: node scripts/operator-write-approval-mobile-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarberki-gmail-mobile-proof
          path: /tmp/sarberki-gmail-server-proof/RESULT.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarberki-operator-write-mobile-proof
          path: /tmp/sarberki-operator-write-proof/RESULT.json
          if-no-files-found: error
          retention-days: 7
