name: Previo TEST – hot tub note on one phone option (Claude, PERM-20261127-VOICE-TUB-NOTE)
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [docs/PREVIO-TEST-NOTE-APPEND-REQUEST.md]
permissions:
  contents: read
jobs:
  append:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append and read back
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        run: |
          test "$GITHUB_REF" = "refs/heads/gmail-test-subject-allowlist"
          REQ="$(grep -v '^\s*$' docs/PREVIO-TEST-NOTE-APPEND-REQUEST.md | tail -n 1)"
          node scripts/previo-test-note-append-one.mjs "$REQ"
