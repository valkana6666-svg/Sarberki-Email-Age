name: Previo TEST – cancel one named trial option (Claude, owner permission per request)
# Owner 2026-11-27 (PERM-20261127-VOICE-TRIAL-CANCEL). TEST 73521 only; the request line names the permission, the case
# and the stay; the script refuses anything but exactly one SC-… option of that case.
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [docs/PREVIO-TEST-CANCEL-REQUEST.md]
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cancel and read back
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        run: |
          test "$GITHUB_REF" = "refs/heads/gmail-test-subject-allowlist"
          REQ="$(grep -v '^\s*$' docs/PREVIO-TEST-CANCEL-REQUEST.md | tail -n 1)"
          node scripts/previo-test-cancel-one.mjs "$REQ"
