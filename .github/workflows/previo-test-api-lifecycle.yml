name: Previo 73521 read-only child price comparison
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [.github/workflows/previo-test-api-lifecycle.yml]
permissions:
  contents: read
jobs:
  children:
    if: contains(github.event.head_commit.message, '[previo-children-20261110]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove 73521 TEST identity by read only
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        shell: python
        run: |
          import os, re, urllib.request, xml.etree.ElementTree as ET
          assert os.environ['GITHUB_REF']=='refs/heads/gmail-test-subject-allowlist'
          key=os.environ['PREVIO_API_KEY']
          assert re.fullmatch(r'[A-Za-z0-9._~+/=-]{16,512}',key)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('REDIRECT_REFUSED')
          req=urllib.request.Request('https://api.previo.app/x1/hotel/get',data=b'<request><hotId>73521</hotId><lanId>1</lanId></request>',headers={'Authorization':'ApiKey '+key,'Content-Type':'application/xml'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response: root=ET.fromstring(response.read())
          hotel=root if root.tag=='hotel' else root.find('.//hotel')
          assert hotel is not None and hotel.findtext('hotId')=='73521' and re.search(r'API\s*TES[ZT]',hotel.findtext('name',''),re.I)
          proof='PASS identity: 73521 '+hotel.findtext('name')
          print(proof)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(proof+'\n')
      - name: Existing script --children with guarded secret adapter; suggester only
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        run: |
          cat > /tmp/previo-children-secret-adapter.mjs <<'JS'
          import {appendFileSync} from 'node:fs';
          // The query suffix avoids the script's CLI entrypoint while reading its case constants.
          const {CHILD_CASES}=await import('file://'+process.cwd()+'/scripts/previo-price-compare.mjs?cases-only');
          const {previoPriceRequest,PREVIO_TEST_73521}=await import('file://'+process.cwd()+'/shared-core/previo-booking-intent.mjs');
          const {fetchPublicPriceReference}=await import('file://'+process.cwd()+'/price-source/public-price-fallback.mjs');
          const nativeFetch=globalThis.fetch;
          const key=process.env.PREVIO_API_KEY;
          if(!/^[A-Za-z0-9._~+/=-]{16,512}$/.test(key||''))throw Error('SECRET_MISSING');
          if(process.env.GITHUB_REF!=='refs/heads/gmail-test-subject-allowlist')throw Error('BRANCH_REFUSED');
          let count=0;
          globalThis.fetch=async(url,options={})=>{
            const test=CHILD_CASES[count++];
            if(!test||url!=='https://api.previo.app/rest/reservations/accounts/suggester'||options.method!=='POST')throw Error('READ_ONLY_ROUTE_REFUSED');
            const [cabin,arrival,departure,adults,label,ages]=test;
            const req=previoPriceRequest({values:{arrival,departure,adults,children:ages.length,child_ages:ages.join(',')},cabin});
            const headers=new Headers(options.headers);
            if(headers.get('X-Previo-Hotel-Id')!=='73521'||JSON.stringify(req.body)!==options.body)throw Error('TEST_CASE_REFUSED');
            headers.set('Authorization','ApiKey '+key);
            const response=await nativeFetch(url,{...options,headers,redirect:'error',signal:AbortSignal.timeout(20000)});
            const j=response.ok?await response.clone().json():{};
            const ours=fetchPublicPriceReference({arrival,departure,cabin,adults,children:ages});
            const proof={case:label,hotelId:73521,cabin,arrival,departure,adults,childAges:ages,guestCategoryIds:req.body.rooms[0].guests.map(g=>g.guestCategoryId),http:response.status,previoTotal:j.totalPrice??null,systemTotal:ours.total,difference:typeof j.totalPrice==='number'?j.totalPrice-ours.total:null,result:response.ok&&j.totalPrice===ours.total?'PASS':'FAIL'};
            const line=JSON.stringify(proof);console.log(line);appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n'+line+'\n');
            return response;
          };
          process.on('exit',()=>{if(count!==5){console.error('EXPECTED_EXACTLY_FIVE_READS');process.exitCode=1;}});
          JS
          node --check /tmp/previo-children-secret-adapter.mjs
          node --import /tmp/previo-children-secret-adapter.mjs scripts/previo-price-compare.mjs --children
# Owner-approved post-toggle comparison: #9 6777847014; exactly five read-only cases.

  cancelled-voucher-readback:
    if: contains(github.event.head_commit.message, '[previo-voucher-readback-20261110]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove 73521 TEST identity by read only
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        shell: python
        run: |
          import os, re, urllib.request, xml.etree.ElementTree as ET
          assert os.environ['GITHUB_REF']=='refs/heads/gmail-test-subject-allowlist'
          key=os.environ['PREVIO_API_KEY']
          assert re.fullmatch(r'[A-Za-z0-9._~+/=-]{16,512}',key)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('REDIRECT_REFUSED')
          req=urllib.request.Request('https://api.previo.app/x1/hotel/get',data=b'<request><hotId>73521</hotId><lanId>1</lanId></request>',headers={'Authorization':'ApiKey '+key,'Content-Type':'application/xml'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response: root=ET.fromstring(response.read())
          hotel=root if root.tag=='hotel' else root.find('.//hotel')
          assert hotel is not None and hotel.findtext('hotId')=='73521' and re.search(r'API\s*TES[ZT]',hotel.findtext('name',''),re.I)
          proof='PASS identity: 73521 '+hotel.findtext('name')
          print(proof)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(proof+'\n')
      - name: Read existing cancelled voucher using the integrated search builder
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        shell: python
        run: |
          import os, subprocess, urllib.request, xml.etree.ElementTree as ET, json
          assert os.environ['GITHUB_REF']=='refs/heads/gmail-test-subject-allowlist'
          voucher='SC-734A105DF9DAF0FD'
          code="""import {buildVoucherSearchXml} from './shared-core/server-previo-reservation-write.mjs';
          process.stdout.write(buildVoucherSearchXml({hotelId:'73521',voucher:'SC-734A105DF9DAF0FD',arrival:'2027-09-14',departure:'2027-09-16'}));"""
          xml=subprocess.check_output(['node','--input-type=module','-e',code],text=True)
          query=ET.fromstring(xml)
          assert query.findtext('hotId')=='73521' and query.findtext('fulltext')==voucher
          assert [int(x.text) for x in query.findall('statuses/cosId')]==list(range(1,9))
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('REDIRECT_REFUSED')
          req=urllib.request.Request('https://api.previo.app/x1/hotel/searchReservations',data=xml.encode(),headers={'Authorization':'ApiKey '+os.environ['PREVIO_API_KEY'],'Content-Type':'application/xml'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response:
              assert response.status==200
              root=ET.fromstring(response.read())
          assert root.find('.//error') is None
          matches=[x for x in root.iter('reservation') if x.findtext('voucher')==voucher]
          assert len(matches)==1,'EXPECTED_EXACTLY_ONE_VOUCHER'
          record=matches[0]
          assert record.findtext('resId')=='118080399' and record.findtext('comId')=='159225977'
          status=record.findtext('statuses/cosId') or record.findtext('status/statusId') or record.findtext('statusId')
          assert status=='7','EXPECTED_CANCELLED_STATUS'
          proof={'result':'PASS','hotelId':73521,'voucher':voucher,'resId':118080399,'comId':159225977,'status':7,'searchBuilder':'buildVoucherSearchXml','searchRequests':1,'writeRequests':0}
          line=json.dumps(proof); print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(line+'\n')

  lifecycle-r2:
    if: contains(github.event.head_commit.message, '[previo-lifecycle-r2-20261110]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: previo-73521-owner-lifecycle
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rerun 2026-11-11 (owner: "Futtasd az R2-t"), same PERM-20261110-API-LIFECYCLE-R2; Claude read-only preflight PASS.
      - name: Once-only owner-approved lifecycle R2 with exact readbacks and cancellation
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        run: |
          node --check scripts/previo-lifecycle-r2.mjs
          node scripts/previo-lifecycle-r2.mjs

  voucher-response-diagnostic:
    if: contains(github.event.head_commit.message, '[previo-voucher-diag-20261111]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove 73521 TEST identity by read only
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        shell: python
        run: |
          import os, re, urllib.request, xml.etree.ElementTree as ET
          assert os.environ['GITHUB_REF']=='refs/heads/gmail-test-subject-allowlist'
          key=os.environ['PREVIO_API_KEY']
          assert re.fullmatch(r'[A-Za-z0-9._~+/=-]{16,512}',key)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('REDIRECT_REFUSED')
          req=urllib.request.Request('https://api.previo.app/x1/hotel/get',data=b'<request><hotId>73521</hotId><lanId>1</lanId></request>',headers={'Authorization':'ApiKey '+key,'Content-Type':'application/xml'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response: root=ET.fromstring(response.read())
          hotel=root if root.tag=='hotel' else root.find('.//hotel')
          assert hotel is not None and hotel.findtext('hotId')=='73521' and re.search(r'API\s*TES[ZT]',hotel.findtext('name',''),re.I)
          proof='PASS identity: 73521 '+hotel.findtext('name')
          print(proof)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(proof+'\n')
      - name: Inspect only TEST voucher response structure without logging XML
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        shell: python
        run: |
          import subprocess, os, urllib.request, xml.etree.ElementTree as ET, json, hashlib
          assert os.environ['GITHUB_REF']=='refs/heads/gmail-test-subject-allowlist'
          code="""import {buildVoucherSearchXml} from './shared-core/server-previo-reservation-write.mjs';
          process.stdout.write(buildVoucherSearchXml({hotelId:'73521',voucher:'SC-17CAFC194331890A',arrival:'2027-09-16',departure:'2027-09-18'}));"""
          body=subprocess.check_output(['node','--input-type=module','-e',code],text=True).encode()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('REDIRECT_REFUSED')
          req=urllib.request.Request('https://api.previo.app/x1/hotel/searchReservations',data=body,headers={'Authorization':'ApiKey '+os.environ['PREVIO_API_KEY'],'Content-Type':'application/xml'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response:
              assert response.status==200
              data=response.read()
          root=ET.fromstring(data)
          records=list(root.iter('reservation'))
          assert root.tag=='reservations' and root.find('.//error') is None
          proof={'result':'PASS','hotelId':73521,'voucher':'SC-17CAFC194331890A','http':200,'root':root.tag,'rootChildCount':len(root),'reservationCount':len(records),'exactVoucherCount':sum(x.findtext('voucher')=='SC-17CAFC194331890A' for x in records),'selfClosingEmpty':data.strip().endswith(b'<reservations/>'),'responseSha256':hashlib.sha256(data).hexdigest(),'writeRequests':0}
          line=json.dumps(proof);print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(line+'\n')
