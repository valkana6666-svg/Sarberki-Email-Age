name: Previo 73521 one-time cancellation readback
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [.github/workflows/previo-test-api-lifecycle.yml]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[previo-test-20261110]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read cancelled synthetic record only; no write path
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, xml.etree.ElementTree as ET
          assert os.environ['GITHUB_REF']=='refs/heads/gmail-test-subject-allowlist'
          key=os.environ['PREVIO_API_KEY']
          assert len(key)>=16
          body='<request><hotId>73521</hotId><term><from>2027-09-14</from><to>2027-09-16</to></term><termType>overlap</termType><roomsOnly>1</roomsOnly><statuses><cosId>7</cosId></statuses><resId>118080399</resId><fulltext>SC-734A105DF9DAF0FD</fulltext><limit><offset>0</offset><limit>10</limit></limit></request>'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('REDIRECT_REFUSED')
          req=urllib.request.Request('https://api.previo.app/x1/hotel/searchReservations',data=body.encode(),headers={'Authorization':'ApiKey '+key,'Content-Type':'application/xml'})
          with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response:
              root=ET.fromstring(response.read())
          assert root.tag!='error' and root.find('.//error') is None, 'API_ERROR'
          own=[r for r in root.findall('.//reservation') if r.findtext('resId')=='118080399' and r.findtext('voucher')=='SC-734A105DF9DAF0FD']
          assert len(own)==1, 'CANCELLED_RECORD_NOT_FOUND'
          r=own[0]
          assert r.findtext('.//statusId')=='7', 'NOT_CANCELLED'
          assert r.findtext('.//object/objId')=='2392197', 'UNIT_MISMATCH'
          proof=json.dumps(dict(result='PASS',operation='READ_ONLY_CANCELLED_READBACK',hotelId=73521,resId=118080399,comId=159225977,voucher='SC-734A105DF9DAF0FD',statusId=7,unit='11',fromDate=r.findtext('.//term/from'),toDate=r.findtext('.//term/to')))
          print(proof)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(proof+'\n')
