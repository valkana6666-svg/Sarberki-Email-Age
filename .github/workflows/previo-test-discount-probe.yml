name: Previo TEST – per-guest discount API probe (Claude, PERM-20261127-DISCOUNT-API-PROBE)
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [docs/PREVIO-TEST-DISCOUNT-PROBE-REQUEST.md]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          PREVIO_API_KEY: ${{ secrets.PREVIO_TEST_API_KEY }}
        run: |
          test "$GITHUB_REF" = "refs/heads/gmail-test-subject-allowlist"
          node scripts/previo-test-discount-probe.mjs
