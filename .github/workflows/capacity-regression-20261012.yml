name: Capacity regression test branch
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths:
      - '.github/workflows/capacity-regression-20261012.yml'
      - '*.mjs'
      - 'tests/**'
      - 'price-source/**'
      - 'package.json'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
