name: Sárberki one-time read-only Previo capacity crosscheck

# Only the isolated test branch triggers this job. The first run is expected to
# fail closed if the matching GitHub + Netlify test secrets have not been set.
# Re-run the failed job AFTER setting both secrets; never modify main/production.
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths:
      - .github/workflows/previo-readonly-crosscheck-20261010.yml
      - tests/previo-live-two-window-check-20261010.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare public Previo type pools with isolated test Netlify response
        env:
          SARBERKI_EXPLICIT_ANONYMOUS_READ_ONLY_PROBE: "2026-10-10"
          PREVIO_CAPACITY_TEST_TOKEN: ${{ secrets.PREVIO_CAPACITY_TEST_TOKEN }}
        run: node tests/previo-live-two-window-check-20261010.mjs
