name: Secret presence check (names only)
# Owner 2026-11-25: was an ElevenLabs key saved for Claude? Prints only SET / NOT SET per candidate name – never a value.
on:
  push:
    branches: [gmail-test-subject-allowlist]
    paths: [.github/workflows/secret-presence.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Presence only
        env:
          A: ${{ secrets.ELEVENLABS_API_KEY }}
          B: ${{ secrets.ELEVENLABS_CLAUDE_TEST_API_KEY }}
          C: ${{ secrets.ELEVEN_LABS_API_KEY }}
          D: ${{ secrets.ELEVENLABS_KEY }}
          E: ${{ secrets.ELEVENLABS_CLAUDE_API_KEY }}
          F: ${{ secrets.XI_API_KEY }}
          G: ${{ secrets.RETELL_CLAUDE_TEST_API_KEY }}
        run: |
          for v in "ELEVENLABS_API_KEY:$A" "ELEVENLABS_CLAUDE_TEST_API_KEY:$B" "ELEVEN_LABS_API_KEY:$C" "ELEVENLABS_KEY:$D" "ELEVENLABS_CLAUDE_API_KEY:$E" "XI_API_KEY:$F" "RETELL_CLAUDE_TEST_API_KEY:$G"; do
            n="${v%%:*}"; val="${v#*:}"; if [ -n "$val" ]; then echo "$n SET"; else echo "$n NOT SET"; fi
          done
