[build]
  publish = "."
  command = "node scripts/write-build-info.cjs"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/price-quote"
  to = "/.netlify/functions/price-quote"
  status = 200

[[redirects]]
  from = "/api/availability-options"
  to = "/.netlify/functions/availability-options"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
