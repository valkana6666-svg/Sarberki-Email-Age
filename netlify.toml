[build]
  publish = "."
  functions = "netlify/functions"

[functions.price-quote]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium"]

[[redirects]]
  from = "/api/price-quote"
  to = "/.netlify/functions/price-quote"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
